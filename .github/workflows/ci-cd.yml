name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. 테스트 단계
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_api.py"

  # 2. 배포 단계 (강사님이 주신 Self-hosted Runner 방식)
  deploy:
    needs: test       # 💡 테스트가 완벽히 통과해야만 배포가 시작되도록 묶어줍니다.
    runs-on: self-hosted
    steps:
      - name: Execute Deploy Script
        run: |
          cd /home/pc_0728/projects/seminar-api
          git fetch origin main
          git reset --hard origin/main
          docker-compose restart was-host
